<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="1024" height="1024">

    <!-- Outer Rounded Badge -->
    <rect x="8" y="8" width="240" height="240" rx="52" fill="#0F172A" stroke="#38BDF8" stroke-width="5.5"/>
    <!-- Inner Subtle Depth Card -->
    <rect x="20" y="20" width="216" height="216" rx="42" fill="#13223D"/>
    <!-- Subtle Horizontal Coordinate Tracks -->
    <line x1="34" y1="128" x2="222" y2="128" stroke="#1E3A5F" stroke-width="2.5" stroke-dasharray="5 6"/>
    <line x1="38" y1="178" x2="218" y2="178" stroke="#1E3A5F" stroke-width="1.8" stroke-dasharray="4 6"/>

    <!-- Upper Splice-Junction Arcs (Long-Read Isoform Splicing) -->
    <path d="M 60 118 Q 98 52 136 118" fill="none" stroke="#38BDF8" stroke-width="5.0" stroke-linecap="round"/>
    <path d="M 140 118 Q 172 68 202 118" fill="none" stroke="#34D399" stroke-width="5.0" stroke-linecap="round"/>
    <!-- Lower Alternative Splicing Skip Arc -->
    <path d="M 58 140 Q 128 208 200 140" fill="none" stroke="#0EA5E9" stroke-width="3.6" stroke-linecap="round" stroke-dasharray="7 5"/>

    <!-- Primary RNA Isoform Exon Blocks -->
    <rect x="30" y="115" width="44" height="26" rx="7" fill="#0284C7"/>
    <rect x="34" y="118" width="36" height="6" rx="3" fill="#7DD3FC" opacity="0.65"/>

    <rect x="110" y="115" width="40" height="26" rx="7" fill="#059669"/>
    <rect x="114" y="118" width="32" height="6" rx="3" fill="#6EE7B7" opacity="0.65"/>

    <rect x="184" y="115" width="42" height="26" rx="7" fill="#0284C7"/>
    <rect x="188" y="118" width="34" height="6" rx="3" fill="#7DD3FC" opacity="0.65"/>

    <!-- Secondary Minor Isoform Track -->
    <rect x="44" y="170" width="34" height="16" rx="5" fill="#0EA5E9" opacity="0.80"/>
    <line x1="78" y1="178" x2="178" y2="178" stroke="#34D399" stroke-width="3.0" opacity="0.82"/>
    <rect x="178" y="170" width="36" height="16" rx="5" fill="#10B981" opacity="0.88"/>

    <!-- Crisp Cutout Halo for Lightning Bolt -->
    <polygon points="148,30 88,135 126,135 106,226 174,112 134,112" fill="#0F172A" stroke="#0F172A" stroke-width="14" stroke-linejoin="round"/>
    <!-- Main Electric Lightning Bolt (Layered Two-Tone Geometric Facets) -->
    <polygon points="148,30 88,135 126,135 106,226 174,112 134,112" fill="#F59E0B" stroke="#FEF08A" stroke-width="2.4" stroke-linejoin="round"/>
    <!-- Bright Left Specular Highlight Facet -->
    <polygon points="148,30 88,135 126,135 134,112" fill="#FDE047"/>
    <!-- Cool Cyan Lower Tail Highlight -->
    <polygon points="126,135 106,226 156,142" fill="#38BDF8" opacity="0.82"/>

</svg>
